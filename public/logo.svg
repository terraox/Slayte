<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Slayte logo</title>
  <desc>Slayte wordmark with a geometric hexagon mark</desc>

  <defs>
    <style>
      .wordmark {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -3px;
        fill: #111111;
      }
      .dot { fill: #5DCAA5; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #f1f0ec; }
      }
    </style>
  </defs>

  <g transform="translate(148, 60)">

    <!-- Outer hex — dark fill -->
    <polygon points="40,0 72,18 72,54 40,72 8,54 8,18" fill="#111111" />

    <!-- Middle hex — teal outline -->
    <polygon points="40,12 62,24 62,48 40,60 18,48 18,24" fill="none" stroke="#5DCAA5" stroke-width="2"/>

    <!-- Inner hex — solid teal core -->
    <polygon points="40,20 54,28 54,44 40,52 26,44 26,28" fill="#5DCAA5" />

    <!-- Connector line -->
    <line x1="72" y1="36" x2="88" y2="36" stroke="#5DCAA5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wordmark -->
    <text x="96" y="60" class="wordmark">slayte</text>

    <!-- Dot accent -->
    <circle cx="96" cy="74" r="4" class="dot"/>

  </g>

</svg>
